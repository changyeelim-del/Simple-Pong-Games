<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10131c">
  <title>3D Pong Adventure</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px 10px; background: radial-gradient(ellipse at center, #202942, #0b0e16 75%); color: #eef2ff; font-family: system-ui, sans-serif; }
    main { width: min(800px, 96vw); text-align: center; }
    h1 { margin: 0 0 10px; letter-spacing: .12em; text-shadow: 0 0 18px #42e8ff88; }
    .info, .controls, .shop-items { display: flex; align-items: center; justify-content: center; gap: 9px; flex-wrap: wrap; }
    .info { justify-content: space-between; margin: 0 4px 10px; color: #c5d3ec; font-size: .9rem; font-weight: 600; }
    .court { perspective: 1000px; }
    canvas { display: block; width: 100%; height: auto; border: 2px solid #45d9ff; border-radius: 8px; background: #101b2c; box-shadow: 0 24px 45px #0009, 0 0 24px #31d9ff55; transform: rotateX(5deg); transform-origin: center bottom; touch-action: none; }
    .controls { margin-top: 15px; }
    select, button { border: 0; border-radius: 6px; padding: 9px 11px; font: inherit; }
    select { background: #202942; color: #eef2ff; border: 1px solid #45d9ff; }
    button { background: #45d9ff; color: #07121e; font-weight: 700; cursor: pointer; }
    button:hover { background: #8cecff; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    input[type="range"] { width: min(140px, 32vw); accent-color: #45d9ff; }
    #speedValue, #coinCount { min-width: 40px; color: #45d9ff; font-weight: 700; }
    #mapControl[hidden] { display: none; }
    .shop { margin: 14px auto 0; padding: 11px; border: 1px solid #344d6a; border-radius: 8px; background: #101827aa; }
    .shop h2 { margin: 0 0 8px; font-size: 1rem; }
    .shop-items button { font-size: .84rem; padding: 8px 10px; }
    p, .hint { color: #aeb8d0; }
    .hint { margin: 8px 0 0; font-size: .85rem; }
    @media (max-width: 520px) { body { padding: 10px 6px; } .info { font-size: .74rem; } .controls { gap: 7px; } select, button { padding: 8px; font-size: .86rem; } }
  </style>
</head>
<body>
  <main>
    <h1>3D PONG</h1>
    <div class="info"><span id="modeLabel">Adventure</span><span id="roundLabel">Choose a map and start</span><span id="scoreLabel">First to 5</span></div>
    <div class="court"><canvas id="game" width="800" height="500" aria-label="Pong game"></canvas></div>
    <div class="controls">
      <label for="mode">Mode</label>
      <select id="mode"><option value="adventure">Adventure</option><option value="boss">Boss Battle</option><option value="trophy">Trophy Tournament</option><option value="powerup">Power-Up</option></select>
      <span id="mapControl"><label for="map">Map</label> <select id="map"><option value="0">Neon City</option><option value="1">Ice Cavern</option><option value="2">Lava Rift</option><option value="3">Cosmic Core</option></select></span>
      <label for="speed">Speed</label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"><span id="speedValue">1.0×</span>
      <button id="startButton">Start adventure</button>
    </div>
    <p class="hint">Drag on the court or use ↑ / ↓. Win matches to earn coins and unlock maps!</p>
    <section class="shop" aria-label="Paddle shop">
      <h2>🪙 Coins: <span id="coinCount">0</span> · Paddle shop</h2>
      <div class="shop-items" id="shopItems"></div>
      <p class="hint">Coins and unlocked maps are saved on this device. Sound starts after your first tap.</p>
      <div class="shop-items" style="margin-top:8px"><button id="musicButton" type="button">♫ Music: On</button><button id="soundButton" type="button">🔊 Sound: On</button></div>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const modeSelect = document.getElementById('mode'), mapSelect = document.getElementById('map');
  const mapControl = document.getElementById('mapControl'), speedSlider = document.getElementById('speed');
  const speedValue = document.getElementById('speedValue'), modeLabel = document.getElementById('modeLabel');
  const roundLabel = document.getElementById('roundLabel'), scoreLabel = document.getElementById('scoreLabel');
  const startButton = document.getElementById('startButton'), coinCount = document.getElementById('coinCount');
  const shopItems = document.getElementById('shopItems'), musicButton = document.getElementById('musicButton');
  const soundButton = document.getElementById('soundButton');
  const W = canvas.width, H = canvas.height, PW = 13, BASE_H = 90, BR = 9;
  const maps = [
    { name: 'Neon City', top: '#102d48', bottom: '#090f26', glow: '#32dcff', obstacle: '#4af3ff', shapes: [[.5,.34,21],[.5,.66,21]], motion: 0 },
    { name: 'Ice Cavern', top: '#19445d', bottom: '#0d2038', glow: '#9aeaff', obstacle: '#b5f5ff', shapes: [[.5,.5,34]], motion: 0 },
    { name: 'Lava Rift', top: '#51232a', bottom: '#1e101b', glow: '#ff7047', obstacle: '#ff9d39', shapes: [[.5,.3,24],[.5,.7,24]], motion: 1 },
    { name: 'Cosmic Core', top: '#301653', bottom: '#100e2d', glow: '#c27bff', obstacle: '#e1a1ff', shapes: [[.4,.5,23],[.6,.5,23]], motion: 2 }
  ];
  const skins = [
    { id: 'cyan', name: 'Neon Cyan', color: '#32dcff', cost: 0 },
    { id: 'gold', name: 'Golden', color: '#ffd35a', cost: 30 },
    { id: 'rose', name: 'Rose', color: '#ff69c7', cost: 50 },
    { id: 'lime', name: 'Lime', color: '#63ff9c', cost: 75 }
  ];
  const powerups = [
    { type: 'grow', label: 'GROW', color: '#63ff9c' },
    { type: 'shrink', label: 'SHRINK', color: '#ff647c' },
    { type: 'slow', label: 'SLOW', color: '#ffd35a' }
  ];
  const SAVE_KEY = 'simplePongAdventureSaveV6';
  function loadSave() {
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
      return { coins: Math.max(0, Number(saved.coins) || 0), unlocked: Math.max(0, Math.min(maps.length - 1, Number(saved.unlocked) || 0)), owned: Array.isArray(saved.owned) ? [...new Set(['cyan', ...saved.owned.filter(id => skins.some(s => s.id === id))])] : ['cyan'], equipped: skins.some(s => s.id === saved.equipped) ? saved.equipped : 'cyan' };
    } catch { return { coins: 0, unlocked: 0, owned: ['cyan'], equipped: 'cyan' }; }
  }
  let save = loadSave();
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch { /* Continue without persistence if storage is unavailable. */ } }
  let mode = modeSelect.value, speed = Number(speedSlider.value), selectedMap = 0;
  let level = 0, active = false, matchOver = true, finish = 'ready', serveTimer = 0, powerTimer = 2, pickup = null, elapsed = 0, lastTime = 0;
  let title = 'PONG ADVENTURE', subtitle = 'Choose a map and start your journey';
  let audioContext = null, musicOn = true, soundOn = true, musicTimer = null, musicStep = 0, rewarded = false;
  const keys = new Set();
  function paddle(x) { return { x, y: (H-BASE_H)/2, h: BASE_H, score: 0, effects: { grow: 0, shrink: 0, slow: 0 } }; }
  const player = paddle(28), cpu = paddle(W-41), ball = { x: W/2, y: H/2, vx: 0, vy: 0, lastHitter: 'player' };
  function mapIndex() { return mode === 'adventure' ? (level > 0 ? (selectedMap + level - 1) % maps.length : selectedMap) : 0; }
  function currentMap() { return maps[mapIndex()] || maps[0]; }
  function selectedSkin() { return skins.find(s => s.id === save.equipped) || skins[0]; }
  function modeName() { return ({ adventure: 'Adventure', boss: 'Boss Battle', trophy: 'Trophy Tournament', powerup: 'Power-Up Mode' })[mode] || 'Adventure'; }
  function audio() {
    if (!audioContext) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioContext = new AC(); }
    if (audioContext && audioContext.state === 'suspended') audioContext.resume();
    return audioContext;
  }
  function tone(freq, duration = .09, type = 'sine', volume = .045) {
    if (!soundOn) return;
    const ac = audio(); if (!ac) return;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(volume, ac.currentTime); gain.gain.exponentialRampToValueAtTime(.001, ac.currentTime + duration);
    osc.connect(gain); gain.connect(ac.destination); osc.start(); osc.stop(ac.currentTime + duration);
  }
  function startMusic() {
    if (musicTimer || !musicOn) return;
    const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
    musicTimer = setInterval(() => { if (musicOn && !document.hidden) tone(notes[musicStep++ % notes.length], .16, 'triangle', .012); }, 260);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; }
  function renderShop() {
    coinCount.textContent = save.coins;
    shopItems.replaceChildren();
    for (const skin of skins) {
      const button = document.createElement('button');
      const owned = save.owned.includes(skin.id), equipped = save.equipped === skin.id;
      button.textContent = equipped ? `✓ ${skin.name}` : owned ? `Equip ${skin.name}` : `${skin.name} · ${skin.cost}🪙`;
      button.style.border = `1px solid ${skin.color}`; button.disabled = equipped || (!owned && save.coins < skin.cost);
      button.addEventListener('click', () => {
        audio();
        if (!save.owned.includes(skin.id)) { if (save.coins < skin.cost) return; save.coins -= skin.cost; save.owned.push(skin.id); }
        save.equipped = skin.id; persist(); renderShop(); tone(660);
      });
      shopItems.append(button);
    }
    musicButton.textContent = `♫ Music: ${musicOn ? 'On' : 'Off'}`;
    soundButton.textContent = `🔊 Sound: ${soundOn ? 'On' : 'Off'}`;
    for (const option of mapSelect.options) option.disabled = Number(option.value) > save.unlocked;
    if (selectedMap > save.unlocked) { selectedMap = save.unlocked; mapSelect.value = String(selectedMap); }
  }
  function clearEffects(p) { p.effects.grow = p.effects.shrink = p.effects.slow = 0; p.h = BASE_H; }
  function clamp(p) { p.y = Math.max(0, Math.min(H-p.h, p.y)); }
  function setHeight(p, h) { const center = p.y + p.h/2; p.h = h; p.y = center-h/2; clamp(p); }
  function resetBall(dir) { ball.x = W/2; ball.y = H/2; ball.vx = 300*speed*dir; ball.vy = (Math.random()*240-120)*speed; ball.lastHitter = dir > 0 ? 'player' : 'cpu'; serveTimer = .65; pickup = null; powerTimer = 2.4; }
  function resetReady() {
    active = false; matchOver = true; finish = 'ready'; level = 0; rewarded = false;
    player.score = cpu.score = 0; clearEffects(player); clearEffects(cpu); pickup = null;
    modeLabel.textContent = modeName(); roundLabel.textContent = 'Ready to play';
    scoreLabel.textContent = mode === 'powerup' ? 'First to 7' : mode === 'boss' ? 'Boss health: 9' : 'First to 5';
    startButton.textContent = mode === 'adventure' ? 'Start adventure' : mode === 'boss' ? 'Challenge boss' : 'Start game';
    title = mode === 'adventure' ? 'PONG ADVENTURE' : mode === 'boss' ? 'BOSS BATTLE' : modeName().toUpperCase();
    subtitle = mode === 'adventure' ? `${currentMap().name} · clear maps to unlock more` : mode === 'boss' ? 'Defeat the oversized boss paddle!' : 'Press Start game to play';
    draw();
  }
  function updateLabels() {
    modeLabel.textContent = modeName();
    if (mode === 'adventure') roundLabel.textContent = `Map ${mapIndex()+1} of ${maps.length}: ${currentMap().name}`;
    else if (mode === 'trophy') roundLabel.textContent = `Round ${level} of 3`;
    else if (mode === 'boss') roundLabel.textContent = 'Boss battle';
    else roundLabel.textContent = 'Power-Up match';
    scoreLabel.textContent = mode === 'powerup' ? 'First to 7' : mode === 'boss' ? `Boss HP: ${Math.max(0, 9-player.score)}` : 'First to 5';
  }
  function begin() {
    audio(); startMusic(); rewarded = false; active = true;
    if (mode === 'trophy') startLevel(1);
    else { level = mode === 'adventure' ? 1 : 1; player.score = cpu.score = 0; clearEffects(player); clearEffects(cpu); matchOver = false; finish = ''; updateLabels(); title = subtitle = ''; resetBall(Math.random()<.5?-1:1); }
  }
  function startLevel(n) {
    level = n; player.score = cpu.score = 0; clearEffects(player); clearEffects(cpu); player.y = cpu.y = (H-BASE_H)/2;
    matchOver = false; finish = ''; rewarded = false; title = subtitle = ''; updateLabels();
    startButton.textContent = mode === 'adventure' ? 'Restart adventure' : 'Restart tournament'; resetBall(Math.random()<.5?-1:1);
  }
  function earnCoins(amount) { if (rewarded) return; rewarded = true; save.coins += amount; persist(); renderShop(); }
  function completeAdventureMap() {
    const cleared = mapIndex();
    if (cleared < maps.length-1 && save.unlocked < cleared+1) { save.unlocked = cleared+1; persist(); renderShop(); }
    earnCoins(20 + cleared*10);
    if (cleared >= maps.length-1) { finish = 'adventureWin'; title = 'ADVENTURE COMPLETE!'; subtitle = 'You conquered every map! + coins'; roundLabel.textContent = 'Champion!'; startButton.textContent = 'Play again'; }
    else { finish = 'advance'; title = `${maps[cleared].name} cleared!`; subtitle = `Next map unlocked: ${maps[cleared+1].name}`; roundLabel.textContent = 'Map cleared!'; startButton.textContent = 'Next map'; }
  }
  function endMatch() {
    matchOver = true; ball.vx = ball.vy = 0; pickup = null;
    const target = mode === 'powerup' ? 7 : mode === 'boss' ? 9 : 5;
    const won = player.score >= target;
    if (!won) { finish = 'lost'; title = mode === 'boss' ? 'BOSS WINS' : mode === 'adventure' ? 'MAP FAILED' : 'MATCH OVER'; subtitle = 'Try again—you can do it!'; roundLabel.textContent = 'Match lost'; startButton.textContent = 'Try again'; tone(150,.35,'sawtooth'); return; }
    tone(660,.25,'triangle');
    if (mode === 'adventure') completeAdventureMap();
    else if (mode === 'trophy') {
      earnCoins(15 + level*5);
      if (level >= 3) { finish='champion'; title='🏆 TROPHY CHAMPION!'; subtitle='Tournament won! Coins added.'; roundLabel.textContent='Trophy earned!'; startButton.textContent='Play again'; }
      else { finish='advance'; title=`ROUND ${level} WON!`; subtitle='Next round unlocked. Coins added.'; roundLabel.textContent='Round complete'; startButton.textContent='Next round'; }
    } else if (mode === 'boss') { finish='bossWin'; earnCoins(50); title='BOSS DEFEATED!'; subtitle='Amazing! 50 coins earned.'; roundLabel.textContent='Victory!'; startButton.textContent='Play again'; }
    else { finish='powerWin'; earnCoins(10); title='POWER-UP CHAMPION!'; subtitle='You won! 10 coins earned.'; roundLabel.textContent='Victory!'; startButton.textContent='Play again'; }
  }
  function mapObstacles(time) {
    const map = currentMap();
    return map.shapes.map(([nx,ny,r],i) => {
      let y=ny*H; if(map.motion===1)y+=Math.sin(time*1.6+i*Math.PI)*28; if(map.motion===2)y+=Math.sin(time*1.2+i*Math.PI)*18;
      return {x:nx*W,y,r};
    });
  }
  function collideCircle(o) {
    const dx=ball.x-o.x,dy=ball.y-o.y,d=Math.hypot(dx,dy),min=BR+o.r;
    if(d>=min||d===0)return;
    const nx=dx/d,ny=dy/d,dot=ball.vx*nx+ball.vy*ny;
    if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny; tone(230,.05,'sine',.018);}
    ball.x=o.x+nx*(min+1);ball.y=o.y+ny*(min+1);
  }
  function hitPaddle(p) { return ball.x+BR>p.x&&ball.x-BR<p.x+PW&&ball.y+BR>p.y&&ball.y-BR<p.y+p.h; }
  function spawnPickup() { const item=powerups[Math.floor(Math.random()*powerups.length)]; pickup={...item,x:W/2+(Math.random()*90-45),y:80+Math.random()*(H-160),r:19}; }
  function collectPickup() {
    const owner=ball.lastHitter==='cpu'?cpu:player, opponent=ball.lastHitter==='cpu'?player:cpu;
    if(pickup.type==='grow')owner.effects.grow=7; if(pickup.type==='shrink')opponent.effects.shrink=7; if(pickup.type==='slow')opponent.effects.slow=7;
    pickup=null;tone(740,.16,'triangle');
  }
  function scorePoint(forPlayer) {
    if(forPlayer)player.score++;else cpu.score++;
    updateLabels(); tone(forPlayer?580:180,.18,forPlayer?'triangle':'sawtooth');
    const target=mode==='powerup'?7:mode==='boss'?9:5;
    if(player.score>=target||cpu.score>=target)endMatch();else resetBall(forPlayer?-1:1);
  }
  function update(dt) {
    elapsed+=dt;if(!active||matchOver)return;
    for(const p of [player,cpu]) { for(const effect of Object.keys(p.effects))p.effects[effect]=Math.max(0,p.effects[effect]-dt); const h=p.effects.grow>0?130:p.effects.shrink>0?58:BASE_H;if(h!==p.h)setHeight(p,h); }
    if(keys.has('ArrowUp'))player.y-=420*dt;if(keys.has('ArrowDown'))player.y+=420*dt;clamp(player);
    if(mode==='boss') cpu.h=135+Math.sin(elapsed*1.5)*22; else if(cpu.effects.grow<=0&&cpu.effects.shrink<=0)cpu.h=BASE_H;
    const aiBase=mode==='trophy'?300+level*65:mode==='adventure'?285+mapIndex()*48:mode==='boss'?370:330;
    const aiSpeed=aiBase*speed*(cpu.effects.slow>0?.48:1), diff=ball.y-(cpu.y+cpu.h/2);
    cpu.y+=Math.sign(diff)*Math.min(Math.abs(diff),aiSpeed*dt);clamp(cpu);
    if(serveTimer>0){serveTimer-=dt;return;}
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.y-BR<=0){ball.y=BR;ball.vy=Math.abs(ball.vy);tone(300,.04,'sine',.015);}else if(ball.y+BR>=H){ball.y=H-BR;ball.vy=-Math.abs(ball.vy);tone(300,.04,'sine',.015);}
    if(mode==='adventure')for(const obstacle of mapObstacles(elapsed))collideCircle(obstacle);
    for(const p of [player,cpu]) { const toward=p===player?ball.vx<0:ball.vx>0;if(toward&&hitPaddle(p)){const offset=(ball.y-(p.y+p.h/2))/(p.h/2),dir=p===player?1:-1,v=Math.min(Math.hypot(ball.vx,ball.vy)*1.045,720*speed);ball.vx=dir*v*Math.cos(offset*.9);ball.vy=v*Math.sin(offset*.9);ball.x=p===player?p.x+PW+BR:p.x-BR;ball.lastHitter=p===player?'player':'cpu';tone(p===player?500:250,.07,'square',.025);}}
    if(mode==='powerup'){powerTimer-=dt;if(!pickup&&powerTimer<=0){spawnPickup();powerTimer=8;}if(pickup&&Math.hypot(ball.x-pickup.x,ball.y-pickup.y)<BR+pickup.r)collectPickup();}
    if(ball.x+BR<0)scorePoint(false);else if(ball.x-BR>W)scorePoint(true);
  }
  function draw() {
    const map=currentMap(),bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,map.top);bg.addColorStop(1,map.bottom);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=map.glow+'35';ctx.lineWidth=1;for(let y=70;y<H;y+=65){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.setLineDash([8,12]);ctx.strokeStyle=map.glow+'aa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    if(mode==='adventure'){for(const o of mapObstacles(elapsed)){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=map.obstacle+'30';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=map.obstacle;ctx.shadowColor=map.obstacle;ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;}ctx.fillStyle=map.glow;ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(map.name,W/2,H-16);}
    if(mode==='boss'){ctx.fillStyle='#ff4878';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('BOSS',cpu.x+PW/2,cpu.y-12);ctx.strokeStyle='#ff487866';ctx.lineWidth=5;ctx.strokeRect(cpu.x-5,cpu.y-5,PW+10,cpu.h+10);}
    ctx.shadowColor=map.glow;ctx.shadowBlur=12;ctx.fillStyle='#eefaff';ctx.font='bold 42px system-ui';ctx.textAlign='center';ctx.fillText(player.score,W/2-60,55);ctx.fillText(cpu.score,W/2+60,55);
    if(pickup&&mode==='powerup'){ctx.beginPath();ctx.arc(pickup.x,pickup.y,pickup.r,0,Math.PI*2);ctx.fillStyle=pickup.color;ctx.shadowColor=pickup.color;ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#101522';ctx.font='bold 9px system-ui';ctx.fillText(pickup.label,pickup.x,pickup.y+3);}
    ctx.fillStyle=selectedSkin().color;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.fillRect(player.x,player.y,PW,player.h);
    ctx.fillStyle=cpu.effects.shrink>0||cpu.effects.slow>0?'#ffd35a':mode==='boss'?'#ff4878':'#ff69c7';ctx.shadowColor=ctx.fillStyle;ctx.fillRect(cpu.x,cpu.y,PW,cpu.h);
    ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=22;ctx.fill();ctx.shadowBlur=0;
    if(matchOver){ctx.fillStyle='#07101dcc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 31px system-ui';ctx.fillText(title,W/2,H/2-12);ctx.font='18px system-ui';ctx.fillStyle='#bfefff';ctx.fillText(subtitle,W/2,H/2+25);}
  }
  modeSelect.addEventListener('change',()=>{mode=modeSelect.value;mapControl.hidden=mode!=='adventure';resetReady();});
  mapSelect.addEventListener('change',()=>{selectedMap=Number(mapSelect.value);if(selectedMap>save.unlocked){selectedMap=save.unlocked;mapSelect.value=String(selectedMap);}if(mode==='adventure')resetReady();});
  speedSlider.addEventListener('input',()=>{const next=Number(speedSlider.value),ratio=next/speed;ball.vx*=ratio;ball.vy*=ratio;speed=next;speedValue.textContent=`${speed.toFixed(1)}×`;});
  startButton.addEventListener('click',()=>{audio();startMusic();if(!active||['lost','champion','adventureWin','powerWin','bossWin'].includes(finish))begin();else if(matchOver&&finish==='advance'){if(mode==='adventure')startLevel(level+1);else startLevel(level+1);}});
  musicButton.addEventListener('click',()=>{audio();musicOn=!musicOn;musicOn?startMusic():stopMusic();renderShop();});
  soundButton.addEventListener('click',()=>{audio();soundOn=!soundOn;renderShop();if(soundOn)tone(600);});
  canvas.addEventListener('pointerdown',()=>{audio();startMusic();});
  canvas.addEventListener('pointermove',e=>{if(e.buttons===0&&e.pointerType==='mouse'&&!active)return;const rect=canvas.getBoundingClientRect();player.y=(e.clientY-rect.top)*H/rect.height-player.h/2;clamp(player);});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();keys.add(e.key);}});
  window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>keys.clear());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(musicOn)startMusic();});
  function frame(t){const dt=Math.min((t-lastTime)/1000||0,.03);lastTime=t;update(dt);draw();requestAnimationFrame(frame);}
  mapControl.hidden=mode!=='adventure';renderShop();resetReady();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
